[project]
name = "data-agent"
version = "0.1.0"
description = "Multi-agent data scientist assistant powered by Mistral AI, FastAPI, and Streamlit"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.14",
    "fastapi>=0.141.1",
    "groq>=0.37.1",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-mistralai>=1.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
    "uvicorn[standard]>=0.53.0",
]
